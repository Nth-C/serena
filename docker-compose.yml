services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      # --- CONFIGURATION ALWAYS DATA ---
      - SMTP_HOST=smtp-sere-na.alwaysdata.net
      - SMTP_PORT=587
      - SMTP_USER=sere-na@alwaysdata.net 
      - SMTP_PASS=abraham38Rayan
    ports:
      - "8080:80"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor


  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  playwright:
    build: ./frontend
    environment:
      - VITE_API_URL=http://backend:80
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npx playwright test
    depends_on:
      - backend