services:
  db:
    # MODIFICATION : On construit notre image perso au lieu de télécharger l'officielle
    build:
      context: .
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_DB: ma_base
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    volumes:
      - ./data:/docker-entrypoint-initdb.d
    command: >
      postgres 
        -c "shared_preload_libraries=pgaudit,auth_delay" 
        -c "pgaudit.log=write,role,ddl" 
        -c "auth_delay.milliseconds=1000"
        -c "log_statement=mod"


  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      # --- CONFIGURATION ALWAYS DATA ---
      - SMTP_HOST=smtp-sere-na.alwaysdata.net
      - SMTP_PORT=587
      # Attention : souvent l'identifiant complet est nécessaire (nom@alwaysdata.net)
      # D'après tes infos, ton compte est 'sere-na', donc l'email par défaut est souvent :
      - SMTP_USER=sere-na@alwaysdata.net 
      # Tu dois mettre le mot de passe de ce compte email ici :
      - SMTP_PASS=abraham38Rayan
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  playwright:
    image: mcr.microsoft.com/playwright:v1.57.0-jammy
    volumes:
      - .:/work
    working_dir: /work
    environment:
      - NODE_ENV=test
      # On définit l'URL du site pour Playwright
      - BASE_URL=http://frontend:5173
      # On force l'URL de l'API pour que le JS du navigateur sache où est le backend
      - VITE_API_URL=http://backend:80
    # On force Playwright à utiliser ces variables
    command: npx playwright test
    depends_on:
      - frontend
      - backend
      - db