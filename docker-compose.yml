services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      # --- CONFIGURATION ALWAYS DATA ---
      - SMTP_HOST=smtp-sere-na.alwaysdata.net
      - SMTP_PORT=587
      - SMTP_USER=sere-na@alwaysdata.net 
      - SMTP_PASS=abraham38Rayan
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  playwright:
    build: ./frontend
    environment:
      - VITE_API_URL=http://backend:80
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # On ne mappe pas le port 5173 pour éviter le conflit avec ton front actuel
    # Playwright communiquera en interne sur le port 5173 de CE conteneur
    command: npx playwright test
    depends_on:
      - backend