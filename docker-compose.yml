services:
  db:
    # MODIFICATION : On construit notre image perso au lieu de télécharger l'officielle
    build:
      context: .
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_DB: ma_base
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    volumes:
      - ./data:/docker-entrypoint-initdb.d
    command: >
      postgres 
        -c "shared_preload_libraries=pgaudit,auth_delay" 
        -c "pgaudit.log=write,role,ddl" 
        -c "auth_delay.milliseconds=1000"
        -c "log_statement=mod"


  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules